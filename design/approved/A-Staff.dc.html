<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сотрудники</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1a52b8}a:hover{color:#143f8f}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; display: grid; grid-template-columns: 240px minmax(0, 1fr); background: #f4f6f8; font-family: 'Golos Text', system-ui, sans-serif; color: #17222d; font-size: 14px; line-height: 1.45">
<dc-import name="Sidebar" role="admin" active="Сотрудники" person="Алексей Морозов" person-role="Администратор" initials="АМ" hint-size="240px,1000px"></dc-import>
<main style="padding: 28px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Сотрудники</h1><span style="color: #5d6d7c">Роль определяет, какие заявки и разделы видит человек</span></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start">
<section style="background: #ffffff; border: 1px solid #e3e8ec; border-radius: 14px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 160px 120px 120px; gap: 14px; padding: 12px 22px; font-size: 12px; color: #5d6d7c; border-bottom: 1px solid #e3e8ec"><span>Сотрудник</span><span>Роль</span><span style="text-align: right">В работе</span><span>Статус</span></div>
<sc-for list="{{staff}}" as="s" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 160px 120px 120px; gap: 14px; padding: 13px 22px; align-items: center; border-bottom: 1px solid #eef1f3">
<span style="display: flex; gap: 12px; align-items: center; min-width: 0"><span style="width: 38px; height: 38px; border-radius: 50%; background: #dbe6ee; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: #34505f; flex-shrink: 0">{{s.ini}}</span><span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-weight: 600">{{s.name}}</strong><span style="font-size: 12px; color: #5d6d7c">{{s.pos}} · {{s.email}}</span></span></span>
<span style="{{s.roleStyle}}">{{s.role}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; text-align: right; font-size: 13px">{{s.load}}</span>
<span style="{{s.stStyle}}">{{s.st}}</span>
</div>
</sc-for>
</section>
<form style="background: #ffffff; border: 2px solid #1f5fd1; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Новый сотрудник</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">ФИО<input type="text" value="Наталья Белова" style="min-height: 44px; border: 1px solid #cfd8df; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 400; color: #17222d"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Email<input type="email" value="belova@[домен-исполнителя]" style="min-height: 44px; border: 1px solid #cfd8df; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 400; color: #17222d"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Должность<input type="text" value="Аналитик" style="min-height: 44px; border: 1px solid #cfd8df; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 400; color: #17222d"></label>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px">Роль</legend>
<label style="display: flex; gap: 10px; align-items: flex-start; border: 2px solid #1f5fd1; background: #f2f6fe; border-radius: 12px; padding: 11px 13px"><input type="radio" name="role" checked style="margin-top: 3px; width: 18px; height: 18px; accent-color: #1f5fd1"><span style="display: flex; flex-direction: column"><strong style="font-weight: 600">Сотрудник</strong><span style="font-size: 12px; color: #5d6d7c">Видит только назначенные заявки и чаты</span></span></label>
<label style="display: flex; gap: 10px; align-items: flex-start; border: 1px solid #cfd8df; border-radius: 12px; padding: 12px 14px"><input type="radio" name="role" style="margin-top: 3px; width: 18px; height: 18px; accent-color: #1f5fd1"><span style="display: flex; flex-direction: column"><strong style="font-weight: 600">Менеджер</strong><span style="font-size: 12px; color: #5d6d7c">Вся очередь, распределение, организации, финансы</span></span></label>
</fieldset>
<span style="font-size: 12px; color: #5d6d7c">Временный пароль будет показан один раз после создания — передайте его сотруднику лично.</span>
<button type="submit" style="min-height: 46px; border-radius: 10px; border: 0; background: #1f5fd1; color: #ffffff; font: inherit; font-weight: 600">Создать сотрудника</button>
</form>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const pill = (bg, fg) => 'justify-self: start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: ' + bg + '; color: ' + fg;
const R = { 'Администратор': pill('#ece6fb', '#4b2f9a'), 'Менеджер': pill('#e4edfb', '#234f8f'), 'Сотрудник': pill('#eef1f3', '#4a5a68') };
const data = [
['АМ', 'Алексей Морозов', 'Руководитель', 'morozov@…', 'Администратор', '—', true],
['ОК', 'Ольга Кузнецова', 'Менеджер проектов', 'kuznetsova@…', 'Менеджер', '—', true],
['ИС', 'Иван Смирнов', 'Разработчик 1С', 'smirnov@…', 'Сотрудник', '4 · 9:30', true],
['СО', 'Сергей Орлов', 'Веб-разработчик', 'orlov@…', 'Сотрудник', '3 · 6:00', true],
['МВ', 'Мария Волкова', 'Специалист поддержки', 'volkova@…', 'Сотрудник', '2 · 3:00', true],
['ДК', 'Дмитрий Ким', 'Стажёр', 'kim@…', 'Сотрудник', '1 · 1:00', true],
['ЕЛ', 'Егор Лапин', 'Разработчик', 'lapin@…', 'Сотрудник', '—', false]
];
const staff = data.map(([ini, name, pos, email, role, load, act]) => ({ ini, name, pos, email, role, load,
roleStyle: R[role], st: act ? 'Активен' : 'Отключён',
stStyle: act ? 'font-size: 13px; color: #22663a' : 'font-size: 13px; color: #5d6d7c' }));
return { staff };
}
}
</script>
</body>
</html>
