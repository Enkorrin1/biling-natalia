<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Боковое меню</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside style="width: 240px; height: 1000px; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e3e8ec; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; font-family: 'Golos Text', system-ui, sans-serif; color: #17222d; font-size: 14px; line-height: 1.45">
<div style="padding: 0 10px; display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 9px; background: #1f5fd1; color: #ffffff; display: grid; place-items: center; font-weight: 700">К</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em">Кабинет заявок</span><span style="font-size: 11px; color: #5d6d7c">{{area}}</span></div>
</div>
<nav aria-label="Основное меню" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<a href="#" style="{{n.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span style="flex-grow: 1">{{n.label}}</span>
<span style="{{n.countStyle}}">{{n.count}}</span>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 14px 10px 0; border-top: 1px solid #e3e8ec; display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 50%; background: #dbe6ee; display: grid; place-items: center; font-weight: 600; color: #34505f; flex-shrink: 0">{{initials}}</div>
<div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><strong style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{person}}</strong><span style="font-size: 12px; color: #5d6d7c">{{personRole}}</span></div>
<button type="button" aria-label="Выйти" style="width: 36px; height: 36px; border: 0; background: none; color: #5d6d7c; display: grid; place-items: center; border-radius: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>
</button>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["client","staff","manager","admin"],"default":"client"},"active":{"editor":"text","default":"Мои заявки"},"person":{"editor":"text","default":"Анна Петрова"},"personRole":{"editor":"text","default":"Владелец организации"},"initials":{"editor":"text","default":"АП"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const role = this.props.role ?? 'client';
const active = this.props.active ?? 'Мои заявки';
const I = {
tickets: 'M4 5h16v14H4z M8 9h8 M8 13h5',
queue: 'M4 6h16 M4 12h16 M4 18h10',
chat: 'M4 5h16v11H9l-5 4z',
finance: 'M3 7h18v12H3z M3 11h18 M7 15h4',
orgs: 'M4 20V8l8-4 8 4v12 M9 20v-6h6v6',
analytics: 'M5 20V10 M12 20V4 M19 20v-7',
kb: 'M5 4h10l4 4v12H5z M9 12h6 M9 16h6',
staff: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 20c0-3 3-5 6-5s6 2 6 5 M16 6a2.5 2.5 0 0 1 0 5 M21 20c0-2.5-1.5-4-4-4.5',
hooks: 'M8 7l-5 5 5 5 M16 7l5 5-5 5',
bell: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z M10 21h4',
profile: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 4-6 8-6s8 2 8 6'
};
const sets = {
client: [['Мои заявки', I.tickets, '2'], ['Общий чат', I.chat, '1'], ['Финансы', I.finance, ''], ['Уведомления', I.bell, '3'], ['База знаний', I.kb, ''], ['Профиль', I.profile, '']],
staff: [['Заявки', I.tickets, '5'], ['Общие чаты', I.chat, '2'], ['Уведомления', I.bell, '4'], ['База знаний', I.kb, ''], ['Профиль', I.profile, '']],
manager: [['Заявки', I.tickets, '12'], ['Очередь', I.queue, '4'], ['Общие чаты', I.chat, '2'], ['Финансы', I.finance, ''], ['Организации', I.orgs, ''], ['Аналитика', I.analytics, ''], ['Уведомления', I.bell, '6'], ['База знаний', I.kb, '']],
admin: [['Заявки', I.tickets, '12'], ['Очередь', I.queue, '4'], ['Общие чаты', I.chat, '2'], ['Финансы', I.finance, ''], ['Организации', I.orgs, ''], ['Аналитика', I.analytics, ''], ['Сотрудники', I.staff, ''], ['Интеграции', I.hooks, ''], ['Уведомления', I.bell, '6'], ['База знаний', I.kb, '']]
};
const nav = (sets[role] || sets.client).map(([label, icon, count]) => {
const on = label === active;
return {
label, icon, count,
style: 'display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 9px; text-decoration: none; font-weight: ' + (on ? '600' : '500') + '; color: ' + (on ? '#1a4fb0' : '#4a5a68') + '; background: ' + (on ? '#e6eefc' : 'transparent'),
countStyle: count ? 'font-size: 12px; font-weight: 600; color: ' + (on ? '#1a4fb0' : '#4a5a68') + '; background: ' + (on ? '#cddcf8' : '#e9eef1') + '; border-radius: 99px; padding: 1px 8px' : 'display: none'
};
});
const area = role === 'client' ? 'для заказчика' : 'для команды';
return { nav: nav, area: area, person: this.props.person ?? 'Анна Петрова', personRole: this.props.personRole ?? 'Владелец организации', initials: this.props.initials ?? 'АП' };
}
}
</script>
</body>
</html>
